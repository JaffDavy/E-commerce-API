openapi: 3.0.0

info:
  title: E-commerce API
  description: |
    API for an E-commerce platform that allows:
    - Creating products
    - Fetching all products
    - Fetching a single product
    - Updating products
    - Deleting products
  version: 1.0.0

servers:
  - url: https://e-commerce-api-1-niwn.onrender.com
    description: Local Development Server

tags:
  - name: Products
    description: Product management endpoints

paths:
  /api/products:
    post:
      summary: Create a new product
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input
        '500':
          description: Server error

    get:
      summary: Get all products
      tags:
        - Products
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          description: Server error

  /api/product/{id}:
    get:
      summary: Get a single product by ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
        '400':
          description: Invalid ID
        '500':
          description: Server error

    put:
      summary: Update a product by ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
        '400':
          description: Invalid input
        '500':
          description: Server error

    delete:
      summary: Delete a product by ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product deleted successfully
        '404':
          description: Product not found
        '400':
          description: Invalid ID
        '500':
          description: Server error

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: iPhone 15
        description:
          type: string
          example: Apple smartphone
        price:
          type: number
          example: 650000
        category:
          type: string
          example: Electronics
        created_at:
          type: string
          format: date-time

    ProductInput:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: MacBook Pro
        description:
          type: string
          example: Apple laptop
        price:
          type: number
          example: 1200000
        category:
          type: string
          example: Electronics
